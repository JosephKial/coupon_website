# Log rotation configuration for Family Coupon Manager

# Nginx logs
/var/log/nginx/*.log {
    daily
    missingok
    rotate 52
    compress
    delaycompress
    notifempty
    create 644 nginx nginx
    postrotate
        docker-compose exec nginx nginx -s reload > /dev/null 2>&1 || true
    endscript
}

# Application logs (if using file logging)
/var/log/coupon-manager/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 root root
    copytruncate
}