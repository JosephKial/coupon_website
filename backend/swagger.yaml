                  example: 1
                limit:
                  type: integer
                  example: 20
                total:
                  type: integer
                  example: 45
                totalPages:
                  type: integer
                  example: 3
                hasNext:
                  type: boolean
                  example: true
                hasPrev:
                  type: boolean
                  example: false
        message:
